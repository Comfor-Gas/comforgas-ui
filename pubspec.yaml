name: comfor_gas
description: Reparto y gestion de garrafas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  provider: ^6.1.5+1
  local_auth: ^2.3.0
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1
  stomp_dart_client: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logomolecula.png"
  # Fondo blanco para que el ícono adaptativo de Android no quede
  # con la molécula "flotando" sobre transparencia en algunos launchers.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logomolecula.png"
  web:
    generate: true
    image_path: "assets/images/logomolecula.png"
    background_color: "#FFFFFF"
    theme_color: "#0175C2"

# /etc/nginx/sites-available/comfor-web
# Reemplazar app.TU-DOMINIO.com por el dominio real (o por 208.68.39.38 para una prueba inicial)

server {
    listen 80;
    listen [::]:80;
    server_name app.TU-DOMINIO.com;

    root /var/www/comfor-web/current;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos que cambian en cada deploy: no cachear (evita que el usuario vea una version vieja)
    location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|main\.dart\.mjs|main\.dart\.wasm|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Recursos estaticos: cache de 7 dias
    location ~* ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Descarga del APK de la version mobile
    location /descargas/ {
        alias /var/www/comfor-downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    # ---- OPCIONAL: solo si el backend Spring Boot corre en ESTE mismo VPS (puerto 8080) ----
    # Ventaja: front y API bajo el mismo dominio -> sin CORS y con HTTPS para ambos.
    # En ese caso, API_URL = https://app.TU-DOMINIO.com
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 20m;   # fotos de evidencias
    # }
    #
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
}

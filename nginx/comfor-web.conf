server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/comfor-web/current;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|main\.dart\.mjs|main\.dart\.wasm|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /descargas/ {
        alias /var/www/comfor-downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /ws/ {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
    }
}
